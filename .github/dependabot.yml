version: 2

updates:
  # Covers .github/workflows and .github/actions.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    commit-message:
      prefix: ci

  # AVM modules are pinned to exact versions, so nothing moves without a pull request.
  - package-ecosystem: terraform
    directories:
      - /bootstrap
      - /landing-zones/platform/management
      - /landing-zones/platform/identity
      - /landing-zones/platform/connectivity
      - /landing-zones/platform/subscriptions
      - /landing-zones/application/dev
    schedule:
      interval: monthly
    commit-message:
      prefix: deps
