name: deploy

# Nothing is applied from a laptop. Pull requests plan; an apply is a deliberate
# dispatch that waits on the reviewer attached to the production environment.
on:
  pull_request:
    paths:
      - "landing-zones/**"
      - ".github/workflows/deploy.yml"
      - ".github/actions/terraform/**"
  workflow_dispatch:
    inputs:
      landing_zone:
        description: Landing zone to act on
        type: choice
        default: all
        options:
          - all
          - platform/identity
          - platform/connectivity
          - platform/management
          - platform/subscriptions
      action:
        description: plan only, or plan and apply
        type: choice
        default: plan
        options: [plan, apply]

permissions:
  contents: read
  id-token: write

jobs:
  plan:
    # A fork's pull request is never given id-token: write, so the login would fail
    # anyway. Skipping keeps the check green for outside contributors.
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        zone:
          - platform/identity
          - platform/connectivity
          - platform/management
          - platform/subscriptions
    concurrency:
      group: tfstate-${{ matrix.zone }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
      - if: github.event_name == 'pull_request' || inputs.landing_zone == 'all' || inputs.landing_zone == matrix.zone
        uses: ./.github/actions/terraform
        with:
          zone: ${{ matrix.zone }}
          command: plan
          client-id: ${{ vars.AZURE_PLAN_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          state-resource-group: ${{ vars.TFSTATE_RESOURCE_GROUP }}
          state-storage-account: ${{ vars.TFSTATE_STORAGE_ACCOUNT }}
          state-subscription: ${{ vars.TFSTATE_SUBSCRIPTION_ID }}

  apply:
    needs: plan
    if: github.event_name == 'workflow_dispatch' && inputs.action == 'apply'
    runs-on: ubuntu-latest
    # Holds the run until a reviewer approves, and is the subject of the only
    # federated credential bound to the identity that can write.
    environment: production
    # Matrix order is apply order: management grants roles on the hub's DNS zones.
    strategy:
      fail-fast: true
      max-parallel: 1
      matrix:
        zone:
          - platform/identity
          - platform/connectivity
          - platform/management
          - platform/subscriptions
    concurrency:
      group: tfstate-${{ matrix.zone }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
      # Replanned rather than carried over: a plan file can hold values Terraform would
      # otherwise mask, and an artifact on a public repository is readable by anyone.
      - if: inputs.landing_zone == 'all' || inputs.landing_zone == matrix.zone
        uses: ./.github/actions/terraform
        with:
          zone: ${{ matrix.zone }}
          command: apply
          client-id: ${{ vars.AZURE_APPLY_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          state-resource-group: ${{ vars.TFSTATE_RESOURCE_GROUP }}
          state-storage-account: ${{ vars.TFSTATE_STORAGE_ACCOUNT }}
          state-subscription: ${{ vars.TFSTATE_SUBSCRIPTION_ID }}
